<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Competitive Intelligence Dashboard</title>
  <meta name="description" content="Crypto exchange competitive intelligence: SG, AU and global signals." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- 4-panel grid — JS populates each panel -->
  <div class="app-grid">
    <header class="panel-top"    id="panel-top"></header>
    <aside  class="panel-left"   id="panel-left"></aside>
    <main   class="panel-middle" id="panel-middle"></main>
    <section class="panel-right" id="panel-right"></section>
    <footer class="panel-bottom" id="panel-bottom"></footer>
  </div>

  <!-- Loading screen sits above grid until data ready -->
  <div class="loading-screen" id="loading-screen">
    <div class="loading-spinner"></div>
    <p>Loading dashboard…</p>
  </div>

  <!-- Modal (outside grid, global) -->
  <div class="modal-backdrop" id="modal-backdrop" aria-hidden="true"></div>
  <div class="modal-box"      id="modal-box"      role="dialog" aria-modal="true" aria-label="Signal detail"></div>

  <script src="js/app.js"></script>
</body>
</html>
